# Round-robin over every API replica. Compose's DNS answers "api" with one
# address per container; nginx reads them once, at start, so start it after
# the replicas (scripts/replicas.sh does).

# The default, 512 connections per worker, counts both sides: 500 clients at
# once plus a connection to a replica for each of them is over it, and nginx
# closes the rest (k6 sees EOF). Found by the first 3-replica run.
worker_processes auto;
events {
  worker_connections 4096;
}

http {
  upstream api {
    server api:8080;
    keepalive 32;
  }

  # One line per request: which replica answered, and with what.
  log_format upstream '$upstream_addr $status';
  access_log /dev/stdout upstream;

  server {
    listen 80;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # nginx retries a failed request on the next replica, but by default
      # never a POST: a booking must not be sent twice behind our back.
      add_header X-Upstream $upstream_addr always;
    }
  }
}
