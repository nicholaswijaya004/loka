# The API as N containers behind nginx, on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.replicas.yml \
#     up -d --scale api=3 api lb
#
# scripts/replicas.sh does this and runs a contention test against :8088.
# Only the API is replicated; correctness lives in Postgres, which every
# replica shares.
services:
  api:
    build:
      context: .
      args:
        CMD: api
    image: loka-api:dev
    environment:
      DATABASE_URL: postgres://loka:loka@postgres:5432/loka?sslmode=disable
      REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      STRATEGY: ${STRATEGY:-single}
      UNSAFE_DECREMENT: ${UNSAFE_DECREMENT:-0}
      # 3 x (20 write + 10 read) = 90 of Postgres's 100 connections.
      API_DB_MAX_CONNS: ${API_DB_MAX_CONNS:-20}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      postgres:
        condition: service_healthy

  lb:
    image: nginx:1.27-alpine
    ports:
      - '8088:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
