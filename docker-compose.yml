services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loka
      POSTGRES_PASSWORD: loka
      POSTGRES_DB: loka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loka"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata: